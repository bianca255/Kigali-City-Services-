<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kigali City Services - Email Verification</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    
    .icon {
      width: 80px;
      height: 80px;
      background: #e8f5e9;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 40px;
    }
    
    h1 {
      font-size: 28px;
      color: #1a1a1a;
      margin-bottom: 16px;
      font-weight: 700;
    }
    
    p {
      font-size: 16px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 24px auto;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .success {
      background: #4caf50;
    }
    
    .error {
      background: #f44336;
    }
    
    .button {
      display: inline-block;
      background: #667eea;
      color: white;
      padding: 14px 32px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      margin-top: 16px;
      transition: background 0.3s;
    }
    
    .button:hover {
      background: #5568d3;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon" id="icon">⏳</div>
    <h1 id="title">Verifying Your Email...</h1>
    <p id="message">Please wait while we verify your email address.</p>
    <div class="spinner" id="spinner"></div>
    <a href="#" id="action" class="button" style="display: none;">Return to App</a>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getAuth, applyActionCode } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';

    const firebaseConfig = {
      apiKey: "AIzaSyB7PmSDSKd1h1550ZGUHxhnHSP39xkCy3w",
      authDomain: "project1-9630a.firebaseapp.com",
      projectId: "project1-9630a",
      storageBucket: "project1-9630a.firebasestorage.app",
      messagingSenderId: "263910366432",
      appId: "1:263910366432:android:e3a8814b54ee75e8220485"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode');
    const oobCode = urlParams.get('oobCode');

    const icon = document.getElementById('icon');
    const title = document.getElementById('title');
    const message = document.getElementById('message');
    const spinner = document.getElementById('spinner');
    const action = document.getElementById('action');

    async function handleVerification() {
      if (mode === 'verifyEmail' && oobCode) {
        try {
          await applyActionCode(auth, oobCode);
          
          spinner.style.display = 'none';
          icon.classList.add('success');
          icon.textContent = '✓';
          title.textContent = 'Email Verified!';
          message.textContent = 'Your email has been successfully verified. You can now return to the Kigali City Services app and log in.';
          action.style.display = 'inline-block';
          action.textContent = 'Success! Close this page';
          
        } catch (error) {
          spinner.style.display = 'none';
          icon.classList.add('error');
          icon.textContent = '✗';
          title.textContent = 'Verification Failed';
          message.textContent = error.message || 'The verification link is invalid or has expired. Please request a new verification email.';
          action.style.display = 'inline-block';
          action.textContent = 'Close this page';
        }
      } else {
        spinner.style.display = 'none';
        icon.textContent = '🏙️';
        title.textContent = 'Kigali City Services';
        message.textContent = 'Navigate to essential services and places across Kigali.';
        action.style.display = 'inline-block';
        action.textContent = 'Learn More';
        action.href = 'https://github.com/bianca255/Kigali-City-Services-';
      }
    }

    handleVerification();
  </script>
</body>
</html>
